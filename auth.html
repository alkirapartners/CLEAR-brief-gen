<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Alkira | Sign in</title>
<link rel="icon" type="image/png" href="/favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tokens mirror the app's design system (web/styles/tokens.css in the front end). */
:root {
  --canvas: #F5F5F3; --surface: #FFFFFF; --ink: #141414; --ink-2: #5F6673;
  --line: rgba(20,20,20,.07); --line-strong: rgba(20,20,20,.13);
  --accent: #2D58F2; --accent-strong: #2144CC;
  --positive: #15803D; --negative: #BE123C;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  color: var(--ink); background: var(--canvas);
  min-height: 100vh; min-height: 100dvh;
  display: flex; align-items: center; justify-content: center; padding: 24px;
  -webkit-font-smoothing: antialiased;
  /* A soft wash of the accent behind the card. */
  background-image: radial-gradient(60% 50% at 50% 0%, rgba(45,88,242,.10), transparent 70%);
  background-repeat: no-repeat;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 24px;
  box-shadow: 0 1px 2px rgba(20,20,20,.04), 0 18px 44px rgba(20,20,20,.07);
  padding: 44px 40px 36px;
  width: 100%; max-width: 420px;
  text-align: center;
  animation: card-in .4s var(--ease-out) both;
}
@keyframes card-in { from { opacity: 0; transform: translateY(12px); } }
.logo { height: 34px; width: auto; margin-bottom: 30px; }
.title { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 8px; }
.sub   { font-size: 15px; color: var(--ink-2); line-height: 1.6; margin-bottom: 26px; }
input {
  width: 100%; height: 52px; padding: 0 16px;
  border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface);
  font-size: 16px; font-family: inherit; color: var(--ink); outline: none; margin-bottom: 12px;
  transition: border-color .15s var(--ease-out), box-shadow .15s var(--ease-out);
}
input::placeholder { color: var(--ink-2); opacity: .7; }
input:hover { border-color: rgba(20,20,20,.25); }
input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(45,88,242,.15); }
.code-input { letter-spacing: 8px; font-size: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.btn {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 52px; padding: 0 24px;
  background: var(--accent); color: #fff; border: none; border-radius: 999px;
  font-size: 16px; font-weight: 500; font-family: inherit; text-decoration: none; cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 6px 18px rgba(45,88,242,.3);
  transition: background-color .15s var(--ease-out), box-shadow .15s var(--ease-out), transform .15s var(--ease-out);
}
.btn:hover { background: var(--accent-strong); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 10px 26px rgba(45,88,242,.38); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: default; box-shadow: none; }
.link-btn {
  display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; margin-top: 4px;
  background: none; border: none; border-radius: 999px;
  color: var(--ink-2); font-size: 14px; font-family: inherit; cursor: pointer;
  transition: color .15s var(--ease-out), background-color .15s var(--ease-out);
}
.link-btn:hover { color: var(--ink); background: rgba(20,20,20,.05); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus-visible { outline: none; }
.msg { font-size: 14px; color: var(--ink-2); margin-top: 14px; min-height: 21px; line-height: 1.5; }
.msg.error { color: var(--negative); }
.msg.ok    { color: var(--positive); }
.warning {
  margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line);
  font-size: 12.5px; color: var(--ink-2); line-height: 1.55; text-align: center;
}
.checking { color: var(--ink-2); font-size: 15px; }
@media (max-width: 480px) { .card { padding: 32px 22px 28px; border-radius: 20px; } }
@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
  * { transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="card" id="card">
  <div id="checking" class="checking">Checking session…</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const errorParam = params.get('error');

async function boot() {
  // Check for existing session
  try {
    const r = await fetch('/api/auth/session', { cache: 'no-store', credentials: 'same-origin' });
    if (r.ok) {
      const d = await r.json();
      if (d.ok && d.email) {
        const dest = d.role === 'admin' && params.get('next') === 'admin'
          ? '/admin.html'
          : '/';
        location.replace(dest);
        return;
      }
    }
  } catch(e) { /* no session */ }

  // Explicit sign-out (URL param or persisted cookie): show SSO button, don't auto-redirect
  const noSso = params.get('signed_out') === '1' ||
    document.cookie.split(';').some(c => c.trim() === 'briefgen_no_sso=1');
  if (noSso) {
    showSsoForm();
    return;
  }

  // Admin hint cookie present — silently redirect to dashboard SSO
  if (document.cookie.split(';').some(c => c.trim() === 'ak_admin=1')) {
    location.href = 'https://dashboard.partners.alkira.cc/?return_to=briefgen';
    return;
  }

  // Non-admin — show OTP form
  showForm();
}

function showSsoForm() {
  document.getElementById('card').innerHTML = `
    <img src="/Alkira-Logo-Registered-Color.png" class="logo" alt="Alkira">
    <div class="title">Sign in</div>
    <div class="sub">Sign in with your Alkira account.</div>
    <a class="btn" href="https://dashboard.partners.alkira.cc/?return_to=briefgen">Sign in via Okta SSO</a>
    <div class="warning">This system is for authorized users only. Unauthorized access is strictly prohibited and may be subject to legal action.</div>
  `;
}

function showForm() {
  document.getElementById('card').innerHTML = `
    <img src="/Alkira-Logo-Registered-Color.png" class="logo" alt="Alkira">
    <h1 class="title">Alkira Brief Generator</h1>
    <div id="step1">
      <div class="sub">Enter your work email to receive a sign-in code.</div>
      <input id="email" type="email" placeholder="you@company.com" autocomplete="email" aria-label="Work email">
      <button class="btn" id="btn" type="button">Send sign-in code</button>
    </div>
    <div id="step2" style="display:none">
      <div class="sub">Enter the 6-digit code sent to your email.</div>
      <input id="code" class="code-input" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code" aria-label="6-digit sign-in code">
      <button class="btn" id="verify-btn" type="button">Sign in</button>
      <button id="back-btn" class="link-btn" type="button">Use a different email</button>
      <button id="resend-btn" class="link-btn" type="button">Send a new code</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
    <div class="warning">This system is for authorized users only. Unauthorized access is strictly prohibited and may be subject to legal action.</div>
  `;

  const emailEl   = document.getElementById('email');
  const btn       = document.getElementById('btn');
  const msg       = document.getElementById('msg');
  const codeEl    = document.getElementById('code');
  const verifyBtn = document.getElementById('verify-btn');
  const backBtn   = document.getElementById('back-btn');
  const step1     = document.getElementById('step1');
  const step2     = document.getElementById('step2');
  let pendingEmail = '';

  function setMsg(text, type) { msg.className = 'msg' + (type ? ' ' + type : ''); msg.textContent = text; }

  async function submit() {
    const email = emailEl.value.trim();
    if (!email) return;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setMsg('Please enter a valid email address.', 'error'); return; }
    btn.disabled = true; setMsg('Sending…');
    try {
      const r = await fetch('/api/auth/send', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin', body: JSON.stringify({ email }),
      });
      const d = await r.json();
      if (r.ok && d.adminSso) {
        location.href = 'https://dashboard.partners.alkira.cc/?return_to=briefgen';
      } else if (r.ok) {
        pendingEmail = email;
        step1.style.display = 'none'; step2.style.display = '';
        setMsg('Code sent! Check your email.', 'ok'); codeEl.focus();
      } else {
        setMsg(r.status === 403 ? 'Your email domain is not authorized. Contact your Alkira representative.' : (d.error || 'Something went wrong.'), 'error');
        btn.disabled = false;
      }
    } catch(e) { setMsg('Something went wrong. Please try again.', 'error'); btn.disabled = false; }
  }

  async function verify() {
    const code = codeEl.value.trim();
    if (!code) return;
    verifyBtn.disabled = true; setMsg('Verifying…');
    try {
      const r = await fetch('/api/auth/verify', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin', body: JSON.stringify({ email: pendingEmail, code }),
      });
      const d = await r.json();
      if (r.ok && d.ok) { location.href = d.redirect || '/'; }
      else { setMsg(d.error || 'Invalid code.', 'error'); verifyBtn.disabled = false; }
    } catch(e) { setMsg('Something went wrong. Please try again.', 'error'); verifyBtn.disabled = false; }
  }

  btn.addEventListener('click', submit);
  emailEl.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  verifyBtn.addEventListener('click', verify);
  codeEl.addEventListener('keydown', e => { if (e.key === 'Enter') verify(); });
  backBtn.addEventListener('click', () => {
    step2.style.display = 'none'; step1.style.display = '';
    codeEl.value = ''; btn.disabled = false; setMsg('');
  });

  document.getElementById('resend-btn').addEventListener('click', async () => {
    if (!pendingEmail) return;
    setMsg('Sending new code…');
    try {
      const r = await fetch('/api/auth/send', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin', body: JSON.stringify({ email: pendingEmail }),
      });
      const d = await r.json();
      if (r.ok && !d.adminSso) { codeEl.value = ''; codeEl.focus(); setMsg('New code sent! Check your email.', 'ok'); }
      else setMsg('Could not send code. Please try again.', 'error');
    } catch(e) { setMsg('Something went wrong. Please try again.', 'error'); }
  });
  emailEl.focus();
}

boot();
</script>
</body>
</html>
