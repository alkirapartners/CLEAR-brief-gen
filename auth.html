<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign In — Alkira | Brief Generator</title>
<link rel="icon" type="image/png" href="/favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #F4F7FB; min-height: 100vh;
       display: flex; align-items: center; justify-content: center; padding: 24px; }

.card {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(13,47,94,.12);
  padding: 48px 40px;
  width: 100%;
  max-width: 400px;
  text-align: center;
}
.logo { height: 36px; width: auto; margin-bottom: 28px; }
.title { font-size: 20px; font-weight: 700; color: #0D1B35; margin-bottom: 8px; }
.sub   { font-size: 14px; color: #6b7280; line-height: 1.6; margin-bottom: 28px; }
input  {
  width: 100%; padding: 11px 14px; border: 1px solid #D1D5DB; border-radius: 8px;
  font-size: 15px; font-family: inherit; outline: none; margin-bottom: 12px; transition: border .15s;
}
input:focus { border-color: #0D2F5E; box-shadow: 0 0 0 3px rgba(13,47,94,.1); }
.btn {
  width: 100%; padding: 12px; background: #0D2F5E; color: #fff; border: none;
  border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer;
  transition: background .15s;
}
.btn:hover   { background: #164b8a; }
.btn:disabled { opacity: .5; cursor: default; }
.msg { font-size: 13px; color: #6b7280; margin-top: 14px; min-height: 20px; line-height: 1.5; }
.msg.error { color: #DC2626; }
.msg.ok    { color: #059669; }
.warning {
  background: #fffbeb;
  border: 1px solid #fcd34d;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12px;
  color: #92400e;
  line-height: 1.5;
  margin-top: 24px;
  text-align: center;
}
.admin-link {
  display: inline-block;
  margin-top: 24px;
  font-size: 12px;
  color: #9CA3AF;
  text-decoration: none;
  transition: color .15s;
}
.admin-link:hover { color: #0D2F5E; }
.checking { color: #6b7280; font-size: 14px; }
@media (max-width: 480px) { .card { padding: 28px 20px; } }
</style>
</head>
<body>
<div class="card" id="card">
  <div id="checking" class="checking">Checking session…</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const errorParam = params.get('error');

async function boot() {
  // Check for existing session
  try {
    const r = await fetch('/api/auth/session', { cache: 'no-store', credentials: 'same-origin' });
    if (r.ok) {
      const d = await r.json();
      if (d.ok && d.email) {
        const dest = d.role === 'admin' && params.get('next') === 'admin'
          ? '/admin.html'
          : '/?auth_email=' + encodeURIComponent(d.email);
        location.replace(dest);
        return;
      }
    }
  } catch(e) { /* no session */ }

  // Explicit sign-out: show SSO button, don't auto-redirect
  if (params.get('signed_out') === '1') {
    showSsoForm();
    return;
  }

  // Admin hint cookie present — silently redirect to dashboard SSO
  if (document.cookie.split(';').some(c => c.trim() === 'ak_admin=1')) {
    location.href = 'https://dashboard.partners.alkira.cc/?return_to=briefgen';
    return;
  }

  // Non-admin — show OTP form
  showForm();
}

function showSsoForm() {
  document.getElementById('card').innerHTML = `
    <img src="/Alkira-Logo-Registered-Color.png" class="logo" alt="Alkira">
    <div class="title">Sign In</div>
    <div class="sub">Sign in with your Alkira account.</div>
    <a href="https://dashboard.partners.alkira.cc/?return_to=briefgen"
       style="display:block;width:100%;padding:12px;background:#0D2F5E;color:#fff;border-radius:8px;font-size:15px;font-weight:700;text-decoration:none;text-align:center;box-sizing:border-box">
      Sign in via Okta SSO →
    </a>
    <div class="warning">⚠️ This system is for authorized users only. Unauthorized access is strictly prohibited and may be subject to legal action.</div>
  `;
}

function showForm() {
  document.getElementById('card').innerHTML = `
    <img src="/Alkira-Logo-Registered-Color.png" class="logo" alt="Alkira">
    <div class="title">Alkira Brief Generator</div>
    <div id="step1">
      <div class="sub">Enter your work email to receive a sign-in code.</div>
      <input id="email" type="email" placeholder="you@company.com" autocomplete="email">
      <button class="btn" id="btn">Login</button>
    </div>
    <div id="step2" style="display:none">
      <div class="sub">Enter the 6-digit code sent to your email.</div>
      <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code" style="letter-spacing:6px;font-size:22px;text-align:center">
      <button class="btn" id="verify-btn">Sign In</button>
      <button id="back-btn" style="background:none;border:none;color:#6b7280;font-size:13px;cursor:pointer;margin-top:4px;text-decoration:underline;font-family:inherit">Use a different email</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="warning">⚠️ This system is for authorized users only. Unauthorized access is strictly prohibited and may be subject to legal action.</div>
  `;

  const emailEl   = document.getElementById('email');
  const btn       = document.getElementById('btn');
  const msg       = document.getElementById('msg');
  const codeEl    = document.getElementById('code');
  const verifyBtn = document.getElementById('verify-btn');
  const backBtn   = document.getElementById('back-btn');
  const step1     = document.getElementById('step1');
  const step2     = document.getElementById('step2');
  let pendingEmail = '';

  function setMsg(text, type) { msg.className = 'msg' + (type ? ' ' + type : ''); msg.textContent = text; }

  async function submit() {
    const email = emailEl.value.trim();
    if (!email) return;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setMsg('Please enter a valid email address.', 'error'); return; }
    btn.disabled = true; setMsg('Sending…');
    try {
      const r = await fetch('/api/auth/send', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin', body: JSON.stringify({ email }),
      });
      const d = await r.json();
      if (r.ok && d.adminSso) {
        location.href = 'https://dashboard.partners.alkira.cc/?return_to=briefgen';
      } else if (r.ok) {
        pendingEmail = email;
        step1.style.display = 'none'; step2.style.display = '';
        setMsg('Code sent! Check your email.', 'ok'); codeEl.focus();
      } else {
        setMsg(r.status === 403 ? 'Your email domain is not authorized. Contact your Alkira representative.' : (d.error || 'Something went wrong.'), 'error');
        btn.disabled = false;
      }
    } catch(e) { setMsg('Something went wrong. Please try again.', 'error'); btn.disabled = false; }
  }

  async function verify() {
    const code = codeEl.value.trim();
    if (!code) return;
    verifyBtn.disabled = true; setMsg('Verifying…');
    try {
      const r = await fetch('/api/auth/verify', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin', body: JSON.stringify({ email: pendingEmail, code }),
      });
      const d = await r.json();
      if (r.ok && d.ok) { location.href = d.redirect || '/'; }
      else { setMsg(d.error || 'Invalid code.', 'error'); verifyBtn.disabled = false; }
    } catch(e) { setMsg('Something went wrong. Please try again.', 'error'); verifyBtn.disabled = false; }
  }

  btn.addEventListener('click', submit);
  emailEl.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  verifyBtn.addEventListener('click', verify);
  codeEl.addEventListener('keydown', e => { if (e.key === 'Enter') verify(); });
  backBtn.addEventListener('click', () => {
    step2.style.display = 'none'; step1.style.display = '';
    codeEl.value = ''; btn.disabled = false; setMsg('');
  });
  emailEl.focus();
}

boot();
</script>
</body>
</html>
