
server {
    listen 80;
    server_name briefgen.partners.alkira.cc;


    server_tokens off;

    # Redirects are issued as paths, not http:// addresses. Behind the HTTPS load
    # balancer an http:// redirect is blocked by browsers for background requests,
    # so an expired session would look like a network error instead of sign-in.
    absolute_redirect off;

    # ── Static assets (no auth required) ──────────────────────────────────
    location = /favicon.png {
        root /var/www/briefgen;
        add_header Cache-Control "no-cache, no-store";
    }
    location = /Alkira-Logo-Registered-Color.png { root /var/www/briefgen; }
    location = /Alkira-Logo-Registered-White.png { root /var/www/briefgen; }

    # ── Auth page (public) ─────────────────────────────────────────────────
    location = /auth.html {
        root /var/www/briefgen;
        add_header Cache-Control "no-cache, no-store";
    }

    # ── Admin page (behind auth gate) ─────────────────────────────────────
    location = /admin.html {
        auth_request /api/auth/check;
        error_page 401 = @auth_redirect;
        root /var/www/briefgen;
        add_header Cache-Control "no-cache, no-store";
    }

    location = /admin {
        return 302 /admin.html;
    }

    # ── Webhook (existing) ─────────────────────────────────────────────────
    location = /webhook {
        proxy_pass http://127.0.0.1:3459;
        proxy_set_header Host $host;
    }

    # ── Internal auth check (nginx auth_request only) ─────────────────────
    location = /api/auth/check {
        internal;
        proxy_pass http://127.0.0.1:3461;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Auth API (no nginx gate — proxy handles its own auth) ─────────────
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3461;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Auth redirect ──────────────────────────────────────────────────────
    location @redirect_home { return 302 /; }
    error_page 404 = @redirect_home;
    location @auth_redirect {
        return 302 /auth.html;
    }

    # ── Radar API (auth handled by app itself) ─────────────────────────────
    location /api/radar/ {
        auth_request /api/auth/check;
        error_page 401 = @auth_redirect;
        auth_request_set $auth_email $upstream_http_x_auth_email;

        proxy_pass http://127.0.0.1:8601;
        proxy_set_header X-Auth-Email $auth_email;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
    }

    # ── Radar root (no trailing slash) — Next.js 308s /radar/ → /radar ─────
    location = /radar {
        auth_request /api/auth/check;
        error_page 401 = @auth_redirect;
        auth_request_set $auth_email $upstream_http_x_auth_email;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Auth-Email $auth_email;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Radar Next.js UI (behind same auth gate as brief-gen) ─────────────
    location /radar/ {
        auth_request /api/auth/check;
        error_page 401 = @auth_redirect;
        auth_request_set $auth_email $upstream_http_x_auth_email;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Auth-Email $auth_email;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


    # ── Next.js build assets for the shared front end (behind the auth gate) ─
    location /_next/ {
        auth_request /api/auth/check;
        error_page 401 = @auth_redirect;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Brief API (requires valid session) ─────────────────────────────────
    # The API trusts X-Auth-Email, so it is always set here from the auth
    # service's answer, replacing anything the client sent.
    location /api/brief/ {
        auth_request /api/auth/check;
        error_page 401 = @auth_redirect;
        auth_request_set $auth_email $upstream_http_x_auth_email;

        proxy_pass http://127.0.0.1:8501;
        proxy_set_header X-Auth-Email $auth_email;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
    }

    # ── Front end: Brief Generator and Account Radar (requires valid session) ─
    location / {
        auth_request /api/auth/check;
        error_page 401 = @auth_redirect;
        auth_request_set $auth_email $upstream_http_x_auth_email;

        proxy_pass http://127.0.0.1:3001;
        proxy_set_header X-Auth-Email $auth_email;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
    }
}
