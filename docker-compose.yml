services:
  app:
    build: .
    ports:
      # Loopback only: the API trusts X-Auth-Email and must sit behind the auth proxy.
      - "127.0.0.1:8501:8501"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # Optional. Without Supabase the app runs but briefs do not persist.
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
